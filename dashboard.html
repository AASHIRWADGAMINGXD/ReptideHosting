<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Knowledge Pro — Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="theme.css" />
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="flex min-h-screen relative" style="z-index:1">

    <!-- Sidebar (desktop) -->
    <aside class="sidebar-desktop glass glow m-4 mr-0 p-4 w-64 flex-shrink-0 flex flex-col" style="height:calc(100vh - 32px); position:sticky; top:16px;">
      <div class="flex items-center gap-2 mb-6 px-2">
        <span class="text-xl">🧠</span>
        <span class="font-bold gradient-text">Knowledge Pro</span>
      </div>
      <nav id="navLinks" class="flex-1 space-y-1 overflow-y-auto"></nav>
      <div class="pt-4 mt-4 border-t" style="border-color:var(--panel-border)">
        <div class="flex items-center justify-between px-2">
          <span id="userEmail" class="text-xs mono truncate" style="color:var(--text-dim)"></span>
          <button id="logoutBtn" class="text-xs gradient-text font-semibold">Logout</button>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <div class="flex-1 flex flex-col min-w-0">

      <!-- Top bar -->
      <header class="glass glow m-4 mb-0 p-3 flex items-center justify-between gap-3">
        <input id="searchInput" placeholder="Search this section..." class="flex-1 max-w-xs" />
        <div class="flex items-center gap-3">
          <button id="themeToggle" class="gradient-btn text-xs px-3 py-2">🌗 Theme</button>
        </div>
      </header>

      <!-- Content -->
      <main id="content" class="flex-1 m-4 mb-20 md:mb-4 space-y-4"></main>
    </div>
  </div>

  <!-- Bottom nav (mobile) -->
  <nav class="bottom-nav glass glow fixed bottom-3 left-3 right-3 p-2 hidden justify-around" style="z-index:20;">
    <button data-section="overview" class="bn-btn text-xs px-2">📊</button>
    <button data-section="moderation" class="bn-btn text-xs px-2">🛡️</button>
    <button data-section="logs" class="bn-btn text-xs px-2">📜</button>
    <button data-section="settings" class="bn-btn text-xs px-2">⚙️</button>
  </nav>

  <!-- Modal root -->
  <div id="modalRoot"></div>

  <script src="config.js"></script>
  <script src="sections.js"></script>
  <script src="app.js"></script>
</body>
</html>
