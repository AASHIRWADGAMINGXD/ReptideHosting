<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Knowledge Pro — Sign In</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="theme.css" />
</head>
<body class="flex items-center justify-center min-h-screen p-4">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="glass glow w-full max-w-sm p-8">
    <h1 class="text-2xl font-bold mb-1">🧠 <span class="gradient-text">Knowledge Pro</span></h1>
    <p class="text-sm mb-6" style="color:var(--text-dim)">Sign in to access the admin dashboard</p>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="text-xs mono" style="color:var(--text-dim)">EMAIL</label>
        <input type="email" id="email" required class="w-full mt-1" placeholder="you@example.com" />
      </div>
      <div>
        <label class="text-xs mono" style="color:var(--text-dim)">PASSWORD</label>
        <input type="password" id="password" required class="w-full mt-1" placeholder="••••••••" />
      </div>
      <button type="submit" class="gradient-btn w-full">Sign In</button>
    </form>

    <p id="errorMsg" class="text-xs mt-3" style="color:#FC7683; display:none;"></p>

    <p class="text-xs mt-6" style="color:var(--text-dim)">
      No account? Ask the bot owner to create one in Supabase Auth, or
      <a href="#" id="signupToggle" class="gradient-text font-semibold">sign up</a>.
    </p>
  </div>

  <script src="config.js"></script>
  <script>
    let mode = "signin";

    document.getElementById("signupToggle").addEventListener("click", (e) => {
      e.preventDefault();
      mode = mode === "signin" ? "signup" : "signin";
      e.target.textContent = mode === "signin" ? "sign up" : "sign in instead";
      document.querySelector("button[type=submit]").textContent = mode === "signin" ? "Sign In" : "Create Account";
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("errorMsg");
      errorEl.style.display = "none";

      try {
        const { data, error } = mode === "signin"
          ? await supabaseClient.auth.signInWithPassword({ email, password })
          : await supabaseClient.auth.signUp({ email, password });

        if (error) throw error;

        if (mode === "signup" && !data.session) {
          errorEl.style.color = "#6ee7b7";
          errorEl.textContent = "Account created — check your email to confirm, then sign in.";
          errorEl.style.display = "block";
          return;
        }

        window.location.href = "dashboard.html";
      } catch (err) {
        errorEl.style.color = "#FC7683";
        errorEl.textContent = err.message || "Something went wrong.";
        errorEl.style.display = "block";
      }
    });

    // Redirect if already logged in
    supabaseClient.auth.getSession().then(({ data }) => {
      if (data.session) window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
